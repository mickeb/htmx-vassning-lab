# Material for MkDocs configuration for the exercise site.
#
# The site is generated here and the output is committed -- attendees never
# build it, and this file never runs on their machines. src/server.ts serves
# exercises-site/ at http://localhost:4000/exercises.
#
# Build, from the repo root:
#   docker run --rm -v "${PWD}:/docs" squidfunk/mkdocs-material:9.7.7 build
#
# Live preview while writing, on http://localhost:8000:
#   docker run --rm -it -p 8000:8000 -v "${PWD}:/docs" squidfunk/mkdocs-material:9.7.7
#
# The version is pinned. Material for MkDocs entered maintenance mode with
# 9.7.0 (2025-11-11) -- security and critical fixes only -- so there is nothing
# to gain from floating it and a talk to lose if it moves.

site_name: HTMX-vassning — övningar
site_description: Övningar till HTMX-vassningen.
site_url: http://localhost:4000/exercises/

docs_dir: exercises
site_dir: exercises-site

# exercises/README.md documents the exercise convention for whoever writes
# them. It is author notes in English, not attendee material, and MkDocs would
# otherwise make it the front page. The leading slash anchors this to the docs
# root so that each exercise's own README.md is still included.
exclude_docs: |
  /README.md

nav:
  - Start: index.md
  - 1. Installera htmx: 01-import-map/README.md
  - 2. Sortering: 02-sorting/README.md
  - 3. Lägg till en todo: 03-adding/README.md
  - 4. Out-of-band-byten: 04-out-of-band/README.md
  - 5. Bocka av en todo: 05-complete/README.md
  - 6. Fyrverkerier: 06-fireworks/README.md
  - 7. En adress, två svar: 07-one-url/README.md
  - 8. Ge tillbaka adressen: 08-url-state/README.md
  - 9. Sök medan du skriver: 09-search/README.md
  - Extrauppgifter: extra/README.md
  - Vidare läsning: reading/README.md

theme:
  name: material
  language: sv
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Byt till mörkt läge
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Byt till ljust läge

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
