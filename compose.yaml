services:
  lab:
    build: .
    image: htmx-vassning-lab
    container_name: htmx-vassning-lab
    init: true
    # Dependencies are installed into the bind mount, not baked into the image,
    # so that node_modules lands on the host where the editor can see it. Doing
    # it here rather than in a setup script is what makes `docker compose up`
    # the only command an attendee needs. npm is a no-op once it is installed.
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      # Host port is overridable (LAB_PORT=4002 docker compose up) when 4000 is taken.
      - "${LAB_PORT:-4000}:4000"
    volumes:
      # Whole project root, so edits on the host are live in the container.
      - .:/app
    environment:
      NODE_ENV: development
      PORT: "4000"
      # Otherwise the first run tells the attendee to upgrade npm globally,
      # which is the one thing this lab exists to avoid them needing to do.
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      DATABASE_URL: postgres://lab:lab@db:5432/lab
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: htmx-vassning-lab-db
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    volumes:
      # A named volume, not a bind mount: keeping a Postgres data directory in
      # the project folder would be slow on macOS and noise in the repo.
      #
      # Mounted at /var/lib/postgresql, not .../data. Postgres 18 images store
      # data in a major-version subdirectory below this path, and refuse to
      # start if the older .../data mount is used instead.
      - db-data:/var/lib/postgresql
    # No ports published. Nothing outside this network needs the database, and
    # plenty of attendees already have something on 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  db-data:
